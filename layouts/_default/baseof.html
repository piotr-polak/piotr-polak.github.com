<!doctype html>
<html lang="{{ if .Site.LanguageCode }}{{ .Site.LanguageCode }}{{ else }}en{{ end }}">
    {{- partial "head.html" . -}}
    <body>
        <div id="content" class="mx-auto">
            {{- partial "header.html" . -}}
            {{- if .Site.Params.floatingHeader }}{{ partial "floating-header.html" . }}{{ end -}}
            <main class="container">
                {{- block "main" . }}{{- end }}
            </main>
        </div>
        {{- partial "footer.html" . -}}
    </body>
</html>
