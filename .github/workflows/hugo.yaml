name: Build and deploy
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # Pull requests only build and check, so a newer push to a PR cancels its older run;
  # deployments still queue one at a time.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DART_SASS_VERSION: 1.96.0
      GO_VERSION: 1.25.5
      HUGO_VERSION: 0.152.2
      LYCHEE_VERSION: 0.24.2
      LYCHEE_SHA256: 73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5
      NODE_VERSION: 24.12.0
      TZ: Europe/Oslo
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - name: Create directory for user-specific executable files
        run: |
          mkdir -p "${HOME}/.local"
      - name: Install Dart Sass
        run: |
          sass_repo="https://github.com/sass/dart-sass/releases/download"
          sass_file="dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          curl -sLJO "${sass_repo}/${DART_SASS_VERSION}/${sass_file}"
          tar -C "${HOME}/.local" -xf "${sass_file}"
          rm "${sass_file}"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"
      - name: Install Hugo
        run: |
          hugo_repo="https://github.com/gohugoio/hugo/releases/download"
          hugo_file="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sLJO "${hugo_repo}/v${HUGO_VERSION}/${hugo_file}"
          mkdir "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${hugo_file}"
          rm "${hugo_file}"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
      - name: Verify installations
        run: |
          echo "Dart Sass: $(sass --version)"
          echo "Go: $(go version)"
          echo "Hugo: $(hugo version)"
          echo "Node.js: $(node --version)"
      - name: Install Node.js dependencies
        run: |
          [[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true
      - name: Configure Git
        run: |
          git config core.quotepath false
      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ github.run_id }}
          restore-keys:
            hugo-
      - name: Build the site
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "https://www.piotrpolak.com/" \
            --cacheDir "${{ runner.temp }}/hugo_cache"
      - name: Cache save
        id: cache-save
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
      - name: Install lychee
        run: |
          lychee_file="lychee-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL -o "${lychee_file}" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/${lychee_file}"
          echo "${LYCHEE_SHA256}  ${lychee_file}" | sha256sum --check
          mkdir "${HOME}/.local/lychee"
          tar -C "${HOME}/.local/lychee" -xf "${lychee_file}" --strip-components=1
          rm "${lychee_file}"
          echo "${HOME}/.local/lychee" >> "${GITHUB_PATH}"
      - name: Check internal links
        # Offline: only links to this site's own pages, files, and #anchors; a broken one stops the deploy.
        working-directory: public
        run: |
          lychee \
            --offline \
            --include-fragments \
            --root-dir "${PWD}" \
            --index-files index.html \
            --remap "^https://www\.piotrpolak\.com/(.*)$ file://${PWD}/\$1" \
            --no-progress \
            '**/*.html' '**/*.xml'
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
