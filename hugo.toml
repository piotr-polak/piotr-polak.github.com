baseURL = "https://www.piotrpolak.com"
title = "Piotr Polak | Cybersecurity and standardization expert"
languageCode = "en-us"
theme = "devise"
relativeURLs = false
enableEmoji = true
googleAnalytics = ""
enableRobotsTXT = true
copyright = "© 2026 Piotr Polak"

# Main menu items
[menu]
  # pageRef (not url) lets Hugo mark the current page's menu item
  [[menu.main]]
    identifier = "cra"
    name = "CRA guide"
    pageRef = "/cra"
    weight = 10
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    pageRef = "/post"
    weight = 20
  [[menu.main]]
    identifier = "about"
    name = "About"
    pageRef = "/about"
    weight = 30
  [[menu.main]]
    identifier = "contact"
    name = "Contact"
    pageRef = "/contact"
    weight = 40

# Configuration Features
[params]
  author = "Piotr Polak"                                  # Used for the author meta tag
  description = "Practical guidance on the EU Cyber Resilience Act, the RED Delegated Act, and product security standards, from a standardization expert with twenty years in connected product development."      # Your meta description of the site
  header_title = "Piotr Polak"               # Your header title
  header_subtitle = "Cybersecurity and standardization expert" # Your header subtitle
# home_image = "/images/avatar.png"          # Path to header image starting from the static directory (optional)
  home_image = "/avatar.png"                 # Path to header image starting from the static directory (optional)
  recent_posts = 5                           # Max amount of recent posts to show
  mainSections = ["posts", "post", "blog"]   # Main sections to include in recent posts
  [params.style]                             # CSS style overrides
    backgroundColor = "#f5f5f5"
    homeImageBorderColor = "#ffffff"
    fontFamilyBase = "Helvetica Neue"        # First-choice font
    fontColor = "#212529"
  [[params.social]]
    name = "GitHub"
    icon = "github"                          # SVG file in assets/icons/
    href = "https://github.com/piotr-polak"  # Link to associate with icon (http://, https://, mailto:)
  [[params.social]]
    name = "LinkedIn"
    icon = "linkedin"
    href = "https://linkedin.com/in/piotrpolak"
#  [[params.social]]
#    icon = "x"
#    href = "https://x.com/piotrpolak/"
  [[params.social]]
    name = "Email"
    icon = "email"
    href = "mailto:contact@piotrpolak.com"

#Image cache
[caches]
  [caches.images]
    dir = ':cacheDir/images'

# "Read next" links on posts: rank by shared categories, then by date
[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10
