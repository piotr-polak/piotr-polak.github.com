baseURL = "https://www.piotrpolak.com"
title = "Piotr Polak | Cybersecurity and standardization expert"
languageCode = "en-us"
relativeURLs = false
enableEmoji = true
googleAnalytics = ""
enableRobotsTXT = true
copyright = "© 2026 Piotr Polak"

# The devise theme, mounted without its Font Awesome webfonts: the site's icons are inline SVGs
[module]
  [[module.imports]]
    path = "devise"
    [[module.imports.mounts]]
      source = "archetypes"
      target = "archetypes"
    [[module.imports.mounts]]
      source = "assets"
      target = "assets"
    [[module.imports.mounts]]
      source = "layouts"
      target = "layouts"
    [[module.imports.mounts]]
      source = "static"
      target = "static"
      excludeFiles = ["webfonts", "webfonts/**"]

# Categories only; the site does not use tags
[taxonomies]
  category = "categories"

# Main menu items
[menu]
  # pageRef (not url) lets Hugo mark the current page's menu item
  [[menu.main]]
    identifier = "cra"
    name = "CRA guide"
    pageRef = "/cra"
    weight = 10
  [[menu.main]]
    identifier = "posts"
    name = "Articles"
    pageRef = "/post"
    weight = 20
  [[menu.main]]
    identifier = "about"
    name = "About"
    pageRef = "/about"
    weight = 30
  [[menu.main]]
    identifier = "contact"
    name = "Contact"
    pageRef = "/contact"
    weight = 40

# Configuration Features
[params]
  author = "Piotr Polak"                                  # Used for the author meta tag
  description = "Practical guidance on the EU Cyber Resilience Act, the RED Delegated Act, and product security standards, from a standardization expert with twenty years in connected product development."      # Your meta description of the site
  header_title = "Piotr Polak"               # Your header title
  header_subtitle = "Cybersecurity and standardization expert" # Your header subtitle
  share_title = "Making sense of EU cybersecurity regulation" # Title on the home page's share card
# home_image = "/images/avatar.png"          # Path to header image starting from the static directory (optional)
  home_image = "/avatar.png"                 # Path to header image starting from the static directory (optional)
  recent_posts = 5                           # Max amount of recent posts to show
  mainSections = ["posts", "post", "blog"]   # Main sections to include in recent posts
  articleListHiddenCategories = ["Regulations"] # Categories too common to label on the Articles page
  pageLabels = false                         # Small section label above page titles (pageLabel in front matter)
  tocPanel = true                            # Show article contents in a bordered two-column panel
  floatingHeader = true                      # Reveal a compact glass header after the masthead scrolls away
  [params.style]                             # CSS style overrides
    backgroundColor = "#f7f5f0"
    homeImageBorderColor = "#ffffff"
    fontFamilyBase = "system-ui, -apple-system, Segoe UI, Roboto"  # Each platform's UI font first
    fontColor = "#212529"
  [[params.social]]
    name = "GitHub"
    icon = "github"                          # SVG file in assets/icons/
    href = "https://github.com/piotr-polak"  # Link to associate with icon (http://, https://, mailto:)
  [[params.social]]
    name = "LinkedIn"
    icon = "linkedin"
    href = "https://linkedin.com/in/piotrpolak"
#  [[params.social]]
#    icon = "x"
#    href = "https://x.com/piotrpolak/"
  [[params.social]]
    name = "Email"
    icon = "email"
    href = "mailto:contact@piotrpolak.com"

#Image cache
[caches]
  [caches.images]
    dir = ':cacheDir/images'

# "Read next" links on posts: rank by shared categories, then by date
[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10
