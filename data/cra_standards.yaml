# CRA standards tracker (content/cra-standards.md). Edit this file to update the page.
# stage: drafting | enquiry | approval | approved | cited
# item: line in standardization request M/606 (Commission Implementing Decision C(2025) 618)
# oj: false when the CEN-CENELEC project page or the committee says no citation in the Official Journal is expected
as_of: "2026-11-11"

# label: the stage pill; desc: its line in the stage key above the tables
stages:
  drafting:
    label: Drafting
    desc: The committee is writing the draft. It has not reached public enquiry or a formal vote.
  enquiry:
    label: Enquiry
    desc: The draft is out for public enquiry, where national standards bodies comment on it, or the comments are being resolved.
  approval:
    label: Approval
    desc: The draft is in its final approval step. In CEN-CENELEC this is the formal vote; ETSI runs a combined enquiry and vote, followed by final approval.
  approved:
    label: Approved
    desc: The standards body has approved the standard and it is published or awaiting publication. Until it is cited in the Official Journal, it gives no presumption of conformity.
  cited:
    label: Cited in OJ
    desc: The reference is published in the Official Journal of the EU. Applying the standard gives a presumption of conformity with the requirements it covers.

# Recent changes: one entry per re-check, newest first; the page shows the latest three.
# Name what moved and to which stage, with the event date where the source gives one.
changes:
  - date: "2026-11-11"
